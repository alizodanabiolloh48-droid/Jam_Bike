
name: JAM_BIKE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python -u bot.py
